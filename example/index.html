<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scroll film: minimal example</title>
  <style>body { margin: 0; background: #0a1a11; }</style>
</head>
<body>
<!-- Put your frames in film/wide/f_0001.jpg ... f_0220.jpg next to this file, then serve the folder
     (for example: npx serve .) and scroll. -->
<section class="film" style="height:600vh">
  <canvas style="position:sticky;top:0;width:100%;height:100vh;display:block"></canvas>
</section>
<script>
  const section = document.querySelector(".film");
  const canvas = section.querySelector("canvas");
  const ctx = canvas.getContext("2d");
  const N = 220;
  const frames = [...Array(N)].map((_, i) => {
    const img = new Image();
    img.src = `/film/wide/f_${String(i + 1).padStart(4, "0")}.jpg`;
    return img;
  });

  function size() {
    const dpr = Math.min(devicePixelRatio || 1, 1.5);
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
  }

  function draw(i) {
    const img = frames[i];
    if (!img.complete || !img.naturalWidth) return;
    // "cover": fill the canvas, crop the overflow
    const s = Math.max(canvas.width / img.naturalWidth, canvas.height / img.naturalHeight);
    const w = img.naturalWidth * s, h = img.naturalHeight * s;
    ctx.drawImage(img, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
  }

  let current = 0;
  function tick() {
    const r = section.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, -r.top / (r.height - innerHeight)));
    current += (p * (N - 1) - current) * 0.14; // ease toward the scroll position
    draw(Math.round(current));
    requestAnimationFrame(tick);
  }

  addEventListener("resize", size);
  size();
  tick();
</script>
<div style="height: 50vh"></div>
</body>
</html>
